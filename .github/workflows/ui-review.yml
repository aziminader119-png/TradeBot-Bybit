name: TradeBot UI Review - Build and Tests
on:
  push:
    branches: [ui-topnav-unified-20261112]
  pull_request:
    branches: [voice-alert-settings-20261111]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Run tests
        run: npm test
